# Values для домашнего кластера talos-proxmox-cluster.
# Установка:
#   kubectl create namespace to-do-board
#   kubectl label namespace to-do-board pod-security.kubernetes.io/enforce=restricted
#   helm upgrade --install to-do-board charts/to-do-board -n to-do-board -f deploy/talos.values.yaml

config:
  timezone: Europe/Berlin
  telegramDigestHour: 9
  # Хранилище nfs-csi: WAL на NFS не работает.
  sqliteJournalMode: DELETE

vault:
  enabled: true
  secretPath: secret/data/to-do-board
  env:
    TELEGRAM_BOT_TOKEN: TELEGRAM_BOT_TOKEN
  # Адрес, путь аутентификации (talos) и роль (default) берутся из настроек webhook.

ingress:
  enabled: true
  className: traefik
  host: todo.geracorp.org
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloud-production

persistence:
  storageClass: nfs-csi
  size: 1Gi

networkPolicy:
  ingressNamespaces:
    - traefik
