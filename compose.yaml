# Готовый образ из GHCR:   docker compose up -d
# Конкретная версия:       TAG=0.7.2 docker compose up -d
# Локальный код:           docker compose up -d --build
# Обновить готовый образ:  docker compose pull && docker compose up -d
# Настройки берутся из .env (необязательно, шаблон — .env.example).
services:
  app:
    image: ghcr.io/gera-corp/to-do-board:${TAG:-latest}
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    # Важнее .env: эти значения описывают устройство контейнера, а не запуск на хосте.
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      TODO_DB: /data/tasks.db
    volumes:
      - data:/data
      # Корневой сертификат для LDAPS: положите его в ./certs и укажите LDAP_CA_FILE.
      - ${LDAP_CERTS_DIR:-./certs}:/certs:ro
    # Те же ограничения, что в кластере.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:
