apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "to-do-board.fullname" . }}
  labels:
    {{- include "to-do-board.labels" . | nindent 4 }}
spec:
  # SQLite: строго один экземпляр, старый под останавливается до запуска нового.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "to-do-board.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $annotations := include "to-do-board.vaultAnnotations" . | fromYaml | default dict }}
      {{- $annotations = merge $annotations (.Values.podAnnotations | default dict) }}
      {{- with $annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "to-do-board.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "to-do-board.serviceAccountName" . }}
      # Токен ServiceAccount нужен только vault-env для входа в Vault (auth method kubernetes).
      automountServiceAccountToken: {{ .Values.vault.enabled }}
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: app
          image: {{ include "to-do-board.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Команда задана явно: vault-secrets-webhook оборачивает её в vault-env.
          command: ["python3", "-m", "app"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: TODO_DB
              value: /data/tasks.db
            - name: TODO_SQLITE_JOURNAL_MODE
              value: {{ .Values.config.sqliteJournalMode | quote }}
            - name: TODO_COOKIE_SECURE
              value: {{ .Values.config.cookieSecure | quote }}
            - name: TELEGRAM_DIGEST_HOUR
              value: {{ .Values.config.telegramDigestHour | quote }}
            - name: TZ
              value: {{ .Values.config.timezone | quote }}
            - name: TODO_PASSWORD_LOGIN
              value: {{ .Values.config.passwordLogin | quote }}
            - name: FORWARDED_ALLOW_IPS
              value: {{ .Values.config.trustedProxies | quote }}
            {{- with .Values.config.googleClientId }}
            - name: GOOGLE_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.ldap }}
            {{- if .url }}
            - name: LDAP_URL
              value: {{ .url | quote }}
            - name: LDAP_BASE_DN
              value: {{ .baseDn | quote }}
            - name: LDAP_BIND_DN
              value: {{ .bindDn | quote }}
            - name: LDAP_USER_FILTER
              value: {{ .userFilter | quote }}
            - name: LDAP_LOGIN_ATTR
              value: {{ .loginAttr | quote }}
            - name: LDAP_NAME_ATTR
              value: {{ .nameAttr | quote }}
            - name: LDAP_LINK_EXISTING
              value: {{ .linkExisting | quote }}
            - name: LDAP_TLS_INSECURE
              value: {{ .tlsInsecure | quote }}
            {{- if .caSecret }}
            - name: LDAP_CA_FILE
              value: /certs/ca.pem
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.config.smtp }}
            {{- if .host }}
            - name: SMTP_HOST
              value: {{ .host | quote }}
            {{- with .port }}
            - name: SMTP_PORT
              value: {{ . | quote }}
            {{- end }}
            - name: SMTP_SECURITY
              value: {{ .security | quote }}
            {{- with .user }}
            - name: SMTP_USER
              value: {{ . | quote }}
            {{- end }}
            - name: SMTP_FROM
              value: {{ required "config.smtp.from обязателен вместе с config.smtp.host" .from | quote }}
            {{- if .caSecret }}
            - name: SMTP_CA_FILE
              value: /smtp-certs/ca.pem
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with include "to-do-board.publicUrl" . }}
            - name: TODO_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.vault.enabled }}
            {{- range $name, $key := .Values.vault.env }}
            - name: {{ $name }}
              value: {{ printf "vault:%s#%s" $.Values.vault.secretPath $key | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.config.ldap.url .Values.config.ldap.caSecret }}
            - name: ldap-ca
              mountPath: /certs
              readOnly: true
            {{- end }}
            {{- if and .Values.config.smtp.host .Values.config.smtp.caSecret }}
            - name: smtp-ca
              mountPath: /smtp-certs
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "to-do-board.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        {{- if and .Values.config.ldap.url .Values.config.ldap.caSecret }}
        - name: ldap-ca
          secret:
            secretName: {{ .Values.config.ldap.caSecret }}
        {{- end }}
        {{- if and .Values.config.smtp.host .Values.config.smtp.caSecret }}
        - name: smtp-ca
          secret:
            secretName: {{ .Values.config.smtp.caSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
