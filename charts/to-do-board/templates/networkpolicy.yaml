{{- if .Values.networkPolicy.enabled }}
# Входящий трафик — только от ingress controller. Исходящий не ограничен:
# приложению нужны Vault и api.telegram.org.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "to-do-board.fullname" . }}
  labels:
    {{- include "to-do-board.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "to-do-board.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  {{- toYaml .Values.networkPolicy.ingressNamespaces | nindent 18 }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
