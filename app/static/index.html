<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Наш дом</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%232F5BD3'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Вход и первичная настройка -->
  <main id="auth" class="auth" hidden>
    <form id="auth-form" class="auth-card">
      <h1 class="wordmark">Наш дом</h1>
      <p id="auth-hint" class="muted"></p>
      <label>Логин <input name="username" autocomplete="username" required></label>
      <label id="auth-name-field">Как вас называть <input name="display_name" maxlength="64"></label>
      <label>Пароль <input name="password" type="password" autocomplete="current-password" required minlength="4"></label>
      <p id="auth-error" class="error" role="alert"></p>
      <button class="btn primary" id="auth-submit">Войти</button>
    </form>
  </main>

  <!-- Доска -->
  <div id="app" hidden>
    <header class="topbar">
      <h1 class="wordmark">Наш дом</h1>
      <div class="people" id="people-filter" role="group" aria-label="Фильтр по исполнителю"></div>
      <div class="tools">
        <input id="search" type="search" placeholder="Найти задачу" aria-label="Поиск">
        <select id="category-filter" aria-label="Фильтр по категории"></select>
        <button class="btn primary" id="new-task">Новая задача</button>
        <button class="btn ghost" id="open-rating">Рейтинг</button>
        <button class="btn ghost" id="open-people">Люди</button>
        <button class="btn ghost" id="logout">Выйти</button>
      </div>
    </header>
    <main class="board" id="board"></main>
  </div>

  <!-- Карточка задачи -->
  <dialog id="task-dialog" class="wide">
    <div class="task-layout">
      <form id="task-form" method="dialog" class="sheet">
        <div class="sheet-head">
          <h2 id="task-dialog-title">Новая задача</h2>
          <button type="button" class="icon-btn" data-close aria-label="Закрыть">×</button>
        </div>
        <label>Что сделать <input name="title" required maxlength="200" autocomplete="off"></label>
        <label>Подробности <textarea name="description" rows="2" maxlength="5000"></textarea></label>

        <section class="checklist" aria-labelledby="checklist-title">
          <div class="checklist-head">
            <h3 id="checklist-title">Чек-лист</h3>
            <span class="muted small" id="checklist-progress"></span>
          </div>
          <ul id="checklist-items"></ul>
          <div class="checklist-add">
            <input id="checklist-input" maxlength="200" placeholder="Новый пункт" aria-label="Новый пункт чек-листа" autocomplete="off">
            <button type="button" class="btn ghost" id="checklist-add">Добавить</button>
          </div>
        </section>

        <div class="grid2">
          <label>Кто делает <select name="assignee_id"></select></label>
          <label>Колонка <select name="status"></select></label>
          <label>Срок <input name="due_date" type="date"></label>
          <label>Повторять <select name="recurrence">
            <option value="none">Не повторять</option>
            <option value="daily">Каждый день</option>
            <option value="weekly">Каждую неделю</option>
            <option value="monthly">Каждый месяц</option>
          </select></label>
          <label>Категория <input name="category" list="categories" maxlength="40" placeholder="Кухня, покупки…"></label>
          <label>Очки за выполнение <select name="points">
            <option value="1">1 — мелочь</option>
            <option value="2">2</option>
            <option value="3">3 — обычное дело</option>
            <option value="5">5 — заметная работа</option>
            <option value="8">8 — большое дело</option>
          </select></label>
          <fieldset class="priority span2">
            <legend>Важность</legend>
            <label><input type="radio" name="priority" value="low"> Можно потом</label>
            <label><input type="radio" name="priority" value="normal" checked> Обычная</label>
            <label><input type="radio" name="priority" value="high"> Срочно</label>
          </fieldset>
        </div>
        <p id="task-error" class="error" role="alert"></p>
        <div class="sheet-actions">
          <button type="button" class="btn danger-ghost" id="task-delete">Удалить</button>
          <span class="spacer"></span>
          <button type="button" class="btn ghost" data-close>Отмена</button>
          <button class="btn primary" id="task-save">Сохранить</button>
        </div>
      </form>

      <aside class="activity" id="activity" aria-labelledby="activity-title">
        <h3 id="activity-title">История и комментарии</h3>
        <ol id="events"></ol>
        <form id="comment-form" class="comment-form">
          <textarea name="text" rows="2" maxlength="2000" placeholder="Написать комментарий" aria-label="Комментарий"></textarea>
          <button class="btn primary">Отправить</button>
        </form>
      </aside>
    </div>
  </dialog>

  <!-- Рейтинг -->
  <dialog id="rating-dialog">
    <div class="sheet">
      <div class="sheet-head">
        <h2>Рейтинг</h2>
        <button type="button" class="icon-btn" data-close aria-label="Закрыть">×</button>
      </div>
      <div class="segmented" role="tablist" id="rating-periods">
        <button type="button" role="tab" data-period="week">Неделя</button>
        <button type="button" role="tab" data-period="month">Месяц</button>
        <button type="button" role="tab" data-period="all">Всё время</button>
      </div>
      <ol class="rating" id="rating-list"></ol>
      <p class="muted small">Очки начисляются исполнителю, когда задача попадает в Done. Если задачу вернуть из Done, очки снимаются.</p>
    </div>
  </dialog>

  <datalist id="categories"></datalist>

  <!-- Люди -->
  <dialog id="people-dialog">
    <div class="sheet">
      <div class="sheet-head">
        <h2>Люди</h2>
        <button type="button" class="icon-btn" data-close aria-label="Закрыть">×</button>
      </div>
      <section class="telegram" id="telegram-box" hidden></section>
      <ul class="people-list" id="people-list"></ul>
      <form id="user-form" class="user-form">
        <h3 id="user-form-title">Добавить человека</h3>
        <div class="grid2">
          <label id="user-username-field">Логин <input name="username" pattern="[\w.\-]+" maxlength="32" autocomplete="off"></label>
          <label>Имя <input name="display_name" required maxlength="64"></label>
          <label>Пароль <input name="password" type="password" minlength="4" autocomplete="new-password"></label>
          <label class="check" id="user-admin-field"><input type="checkbox" name="is_admin"> Администратор</label>
        </div>
        <div class="swatches" id="swatches" role="radiogroup" aria-label="Цвет магнита"></div>
        <p id="user-error" class="error" role="alert"></p>
        <div class="sheet-actions">
          <button type="button" class="btn ghost" id="user-cancel" hidden>Отменить правку</button>
          <span class="spacer"></span>
          <button class="btn primary" id="user-save">Добавить</button>
        </div>
      </form>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
